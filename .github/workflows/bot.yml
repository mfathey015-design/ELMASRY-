      - name: Run Bot with Auto-Restart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT: 8080
          PYTHONUNBUFFERED: 1
        run: |
          # طباعة مسار ومحتويات المجلد الحالي للتحقق
          echo "Current directory: $(pwd)"
          ls -la
          
          # إذا كان الملف موجوداً في مجلد فرعي، انتقل إليه
          if [ -f "main.py" ]; then
            PYTHON_FILE="main.py"
          elif [ -f "./ELMASRY-/main.py" ]; then
            cd ELMASRY-
            PYTHON_FILE="main.py"
          else
            # البحث التلقائي عن مكان ملف main.py وتشغيله
            FOUND_PATH=$(find . -name "main.py" | head -n 1)
            if [ -n "$FOUND_PATH" ]; then
              DIR_NAME=$(dirname "$FOUND_PATH")
              cd "$DIR_NAME"
            fi
          fi
          
          while true; do
            echo "🚀 Starting bot at $(date)"
            python main.py &
            BOT_PID=$!
            
            COUNTER=0
            while kill -0 $BOT_PID 2>/dev/null; do
              sleep 10
              COUNTER=$((COUNTER + 1))
              
              if [ $((COUNTER % 30)) -eq 0 ]; then
                echo "💓 Bot is alive - $COUNTER/30 cycles"
              fi
            done
            
            echo "⚠️ Bot stopped at $(date) with exit code: $?"
            echo "🔄 Restarting in 5 seconds..."
            sleep 5
          done

