name: Run Bot Clean

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir flask python-telegram-bot psutil requests aiohttp pyTelegramBotAPI telethon
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Start Bot Directly
        run: |
          python main.py

